#
# Applies the patches, runs the tests of every patched package, builds
# chantey for linux/amd64 and linux/arm64 with the source archive, and
# checks that the source archive builds the same archives again. A v* tag
# also publishes the archives, the source archive and SHA256SUMS as a
# GitHub release of that tag.
name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - name: patch, test and build
        run: ./build.sh -t -s
      - name: run the amd64 binary
        run: |
          tar -xzf dist/chantey-*-linux-amd64.tar.gz -C "$RUNNER_TEMP"
          "$RUNNER_TEMP"/chantey-*-linux-amd64/chantey version
      - name: rebuild from the source archive
        run: |
          rm -rf work
          mkdir "$RUNNER_TEMP/src"
          tar -xzf dist/chantey-*-src.tar.gz -C "$RUNNER_TEMP/src"
          (cd "$RUNNER_TEMP"/src/chantey-*-src && ./build.sh -l -o "$RUNNER_TEMP/rebuilt")
          grep -v -- '-src\.tar\.gz$' dist/SHA256SUMS | diff - "$RUNNER_TEMP/rebuilt/SHA256SUMS"
      - uses: actions/upload-artifact@v4
        with:
          name: chantey
          path: dist/
          retention-days: 7

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: chantey
          path: dist
      - name: publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version=${TAG#v}
          base=${version%-chantey.*}
          [ -f "dist/chantey-$version-src.tar.gz" ] || { echo "$TAG does not match the version in patches/" >&2; exit 1; }
          {
            printf 'Chantey %s: sing-box %s with the patches in `patches/%s`.\n\n' "$version" "$base" "$base"
            printf -- '- `chantey-%s-linux-amd64.tar.gz`, `chantey-%s-linux-arm64.tar.gz`: the static binary with `LICENSE` and `NOTICE`.\n' "$version" "$version"
            printf -- '- `chantey-%s-src.tar.gz`: the complete source these are built from. Unpacked, `./build.sh -l` builds the same archives.\n' "$version"
            printf -- '- `SHA256SUMS`: the SHA-256 of each.\n'
          } >"$RUNNER_TEMP/notes.md"
          # Pre-releases until Catboat 1.0.
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --prerelease \
            --title "Chantey $version" --notes-file "$RUNNER_TEMP/notes.md"
